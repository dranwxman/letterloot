<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a2e;
    color: white;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: radial-gradient(ellipse at center, #1a1640 0%, #0a0a2e 70%);
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #1a1640;

  .subtitle { color: #9b94d4; font-size: 13px; margin-top: 4px; }
  .field { margin-bottom: 16px; }
  label { display: block; color: #b8b3e6; font-size: 14px; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 12px 14px;
    background: #0f0c2e;
    border: 1px solid #3a3380;
    border-radius: 10px;
    color: white;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: #6B7CFF; }
  input::placeholder { color: #5c569b; }
  button {

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://zcevszxmoggmcmvyxjtn.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_Eqh7AktNfsPIt0NWdHXwYA_bqiCuVVF";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { detectSessionInUrl: true, flowType: 'pkce' }
  });

  const loadingMsg = document.getElementById('loading-msg');
  const resetForm = document.getElementById('reset-form');
  const successBlock = document.getElementById('success-block');
  const invalidBlock = document.getElementById('invalid-block');
  const errorMsg = document.getElementById('error-msg');
  const submitBtn = document.getElementById('submit-btn');
  const closeHint = document.getElementById('close-hint');

  function showError(text) {
    errorMsg.textContent = text;
    errorMsg.classList.add('show');
  }
  function clearError() {
    errorMsg.classList.remove('show');
  }

  // Supabase emits a PASSWORD_RECOVERY event when the URL hash contains a valid recovery token.
  let recoveryDetected = false;
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
      recoveryDetected = true;
      loadingMsg.classList.remove('show');
      resetForm.classList.remove('hidden');
    }
  });

  // Fallback: if no PASSWORD_RECOVERY event fires within 3 seconds, assume the link is bad.
  setTimeout(() => {
    if (!recoveryDetected) {
      loadingMsg.classList.remove('show');
      invalidBlock.classList.remove('hidden');
      closeHint.style.display = 'none';
    }
  }, 3000);

  resetForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearError();
    const pw1 = document.getElementById('pw1').value;
    const pw2 = document.getElementById('pw2').value;

    if (pw1.length < 8) { showError("Password must be at least 8 characters."); return; }
    if (pw1 !== pw2) { showError("Passwords don't match."); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = "Updating…";

    const { error } = await sb.auth.updateUser({ password: pw1 });

    if (error) {
      submitBtn.disabled = false;
      submitBtn.textContent = "Update password";
      showError(error.message || "Could not update password. Try requesting a new reset link.");
      return;
    }

    // Success
    resetForm.classList.add('hidden');
    successBlock.classList.remove('hidden');
    closeHint.style.display = 'none';

    // Sign out so the session from the recovery link doesn't persist on the website
    try { await sb.auth.signOut(); } catch {}
  });
</script>
